<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私人日记</title><style>body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:24px;box-shadow:0 4px 18px #0000000a}h1{font-size:24px;font-weight:600;margin:0 0 20px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}input,textarea{font:inherit}#date{border:1px solid #ddd;border-radius:8px;padding:8px;background:#fff}textarea{width:100%;min-height:55vh;resize:vertical;border:1px solid #ddd;border-radius:10px;padding:14px;box-sizing:border-box;line-height:1.8;outline:none}textarea:focus{border-color:#999}.status{font-size:12px;color:#888}.sessions{margin-top:22px}.session{border-top:1px solid #eee;padding:14px 0}.stamp{font-size:12px;color:#999;margin-top:7px}.text{white-space:pre-wrap;line-height:1.8}.empty{color:#999;text-align:center;padding:30px}.lock{text-align:center;max-width:360px;margin:90px auto}.lock input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;margin:12px 0}.btn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 12px}.primary{background:#222;color:#fff;border-color:#222}@media(max-width:600px){.wrap{padding:12px}.card{padding:18px;border-radius:10px}textarea{min-height:60vh}}</style></head><body><div class="wrap"><div class="card"><div id="lock" class="lock"><h1>私人日记</h1><p class="status">请输入密码进入</p><input id="pw" type="password" placeholder="密码"><button class="btn primary" onclick="unlock()">进入</button></div><div id="app" hidden><div class="bar"><h1>私人日记</h1><button class="btn" onclick="lock()">锁定</button></div><div class="bar"><input id="date" type="date"><span id="status" class="status">自动保存</span></div><textarea id="editor" placeholder="今天想写点什么……"></textarea><div id="sessions" class="sessions"></div></div></div></div><script>const K='privateDiaryV2';let db=JSON.parse(localStorage.getItem(K)||'null'),pass=null,t=null;const $=x=>document.getElementById(x);const day=()=>{let d=new Date();return d.toISOString().slice(0,10)};const tm=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});function save(){localStorage.setItem(K,JSON.stringify(db))}function unlock(){let p=$('pw').value;if(p.length<4)return alert('密码至少4位');if(!db){db={hash:btoa(unescape(encodeURIComponent(p))),days:{}};save()}if(db.hash!==btoa(unescape(encodeURIComponent(p))))return alert('密码错误');pass=p;$('lock').hidden=true;$('app').hidden=false;$('date').value=day();render()}function lock(){stamp();pass=null;$('app').hidden=true;$('lock').hidden=false;$('pw').value=''}function ensure(d){if(!db.days[d])db.days[d]=[]}function stamp(){let x=$('editor').value.trim();if(!x||!pass)return;let d=$('date').value;ensure(d);db.days[d].push({text:x,time:tm()});save();$('editor').value='';render();$('status').textContent='已保存 '+tm()}function render(){let d=$('date').value;ensure(d);let a=db.days[d];$('sessions').innerHTML=a.length?a.map(s=>`<div class="session"><div class="text"></div><div class="stamp">停笔于 ${s.time}</div></div>`).join(''):'<div class="empty">今天还没有日记</div>';[...$('sessions').querySelectorAll('.text')].forEach((e,i)=>e.textContent=a[i].text)}$('date').onchange=()=>{if(pass)render()};$('editor').onblur=stamp;$('editor').onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')stamp()};</script></body></html>

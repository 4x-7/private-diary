<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>私人日记</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}.wrap{max-width:820px;margin:auto;padding:32px 20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:24px;font-weight:600;margin:0}.date{font:inherit;border:1px solid #ddd;border-radius:8px;padding:9px 11px;background:#fff}.editor{width:100%;min-height:42vh;border:0;outline:0;resize:vertical;font:inherit;font-size:17px;line-height:2;padding:8px 0}.editor::placeholder{color:#aaa}.actions{display:flex;gap:8px;align-items:center;border-top:1px solid #eee;padding-top:14px}.btn{font:inherit;border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer}.primary{background:#222;color:#fff;border-color:#222}.status{font-size:12px;color:#999;margin-left:auto}.sessions{margin-top:32px}.session{padding:18px 0;border-top:1px solid #eee}.text{white-space:pre-wrap;font-size:16px;line-height:1.9}.stamp{margin-top:8px;color:#999;font-size:12px}.empty{color:#aaa;text-align:center;padding:35px 0}.lock{max-width:360px;margin:18vh auto;text-align:center}.lock p{color:#888;font-size:14px}.lock input{width:100%;font:inherit;padding:12px;border:1px solid #ddd;border-radius:8px;margin:12px 0}.hint{font-size:12px;color:#999;line-height:1.6}.danger{color:#b00020;border-color:#eee}@media(max-width:600px){.wrap{padding:20px 16px}.editor{min-height:50vh;font-size:16px}}
</style></head><body><main class="wrap"><section id="lock" class="lock"><h1>私人日记</h1><p id="lockText">第一次使用，请设置一个密码</p><input id="pw" type="password" autocomplete="current-password" placeholder="至少 6 位"><button class="btn primary" onclick="enter()">进入</button><p class="hint">密码只用于解锁本机保存的加密日记。忘记密码无法恢复日记。</p></section><section id="app" hidden><div class="top"><h1>私人日记</h1><button class="btn" onclick="lock()">锁定</button></div><div class="top"><input id="date" class="date" type="date"><span id="state" class="status">已解锁</span></div><textarea id="editor" class="editor" placeholder="今天想写点什么……"></textarea><div class="actions"><button class="btn primary" onclick="stamp()">保存并记录停笔时间</button><span class="status">也会自动保存</span></div><div id="sessions" class="sessions"></div></section></main><script>
const STORE='privateDiarySecureV1';const ITER=210000;let meta=null,key=null,data={days:{}};let timer=null;const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};const now=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});const enc=new TextEncoder(),dec=new TextDecoder();function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a)))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}async function derive(p,s){return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:ITER,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encrypt(){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));return {v:1,salt:meta.salt,iv:b64(iv),ct:b64(ct)}}async function persist(){if(!key)return;localStorage.setItem(STORE,JSON.stringify(await encrypt()));$('state').textContent='已保存 '+now()}async function enter(){const p=$('pw').value;if(p.length<6)return alert('密码至少 6 位');try{if(!meta){const salt=crypto.getRandomValues(new Uint8Array(16));meta={salt:b64(salt)};key=await derive(p,salt);await persist()}else{key=await derive(p,unb64(meta.salt));const raw=JSON.parse(localStorage.getItem(STORE));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},key,unb64(raw.ct));data=JSON.parse(dec.decode(plain));if(!data.days)data={days:{}}}$('pw').value='';$('lock').hidden=true;$('app').hidden=false;$('date').value=today();render()}catch(e){key=null;alert('密码错误或日记数据无法解密。')}}function lock(){stamp();key=null;clearTimeout(timer);$('app').hidden=true;$('lock').hidden=false;$('lockText').textContent='请输入密码进入';$('pw').value=''}function ensure(d){if(!data.days[d])data.days[d]=[]}async function stamp(){const text=$('editor').value.trim();if(!text||!key)return;const d=$('date').value;ensure(d);data.days[d].push({text,time:now()});$('editor').value='';render();await persist()}function render(){const d=$('date').value;ensure(d);const a=data.days[d];$('sessions').innerHTML=a.length?a.map(s=>'<article class="session"><div class="text"></div><div class="stamp">停笔于 '+s.time+'</div></article>').join(''):'<div class="empty">这一天还没有日记</div>';$('sessions').querySelectorAll('.text').forEach((e,i)=>e.textContent=a[i].text)}$('date').onchange=()=>{if(key){stamp();render()}};$('editor').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(persist,1200)});$('editor').addEventListener('blur',()=>{if($('editor').value.trim())stamp()});$('editor').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')stamp()});meta=localStorage.getItem(STORE)?JSON.parse(localStorage.getItem(STORE)):null;if(meta)$('lockText').textContent='请输入密码进入';if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>

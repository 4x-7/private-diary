<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><title>私人日记</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}.wrap{max-width:820px;margin:auto;padding:34px 22px 60px}h1{font-size:23px;font-weight:600;margin:0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.editor{width:100%;min-height:32vh;border:1px solid #e8e8e8;border-radius:10px;outline:0;resize:vertical;font:inherit;font-size:17px;line-height:1.9;padding:16px;background:#fff}.editor:focus{border-color:#bbb}.editor::placeholder{color:#aaa}.actions{display:flex;gap:9px;align-items:center;padding-top:12px}.btn{font:inherit;border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer}.primary{background:#222;color:#fff;border-color:#222}.status{font-size:12px;color:#999;margin-left:auto}.entries{margin-top:38px}.entry{padding:18px 0 22px;border-top:1px solid #eee;position:relative}.text{white-space:pre-wrap;font-size:16px;line-height:1.9;padding-right:55px}.stamp{margin-top:9px;color:#999;font-size:12px}.delete{position:absolute;right:0;top:17px;border:1px solid #e5e5e5;background:#fff;color:#999;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;padding:5px 9px}.delete:hover{color:#b00020;border-color:#d8d8d8}.empty{color:#aaa;text-align:center;padding:35px 0}.lock{max-width:360px;margin:18vh auto;text-align:center}.lock p{color:#888;font-size:14px}.lock input{width:100%;font:inherit;padding:12px;border:1px solid #ddd;border-radius:8px;margin:12px 0}.hint{font-size:12px;color:#999;line-height:1.6}@media(max-width:600px){.wrap{padding:22px 16px 45px}.editor{min-height:42vh;font-size:16px}.entry{padding-right:0}.text{padding-right:52px}}
</style></head><body><main class="wrap"><section id="lock" class="lock"><h1>私人日记</h1><p id="lockText">第一次使用，请设置一个密码</p><input id="pw" type="password" autocomplete="current-password" placeholder="至少 6 位"><button class="btn primary" onclick="enter()">进入</button><p class="hint">密码只用于解锁本机保存的加密日记。忘记密码无法恢复日记。</p></section><section id="app" hidden><div class="top"><h1>私人日记</h1><button class="btn" onclick="lock()">锁定</button></div><textarea id="editor" class="editor" placeholder="今天想写点什么……"></textarea><div class="actions"><button class="btn primary" onclick="saveEntry()">保存日记</button><span id="state" class="status">已解锁</span></div><div id="entries" class="entries"></div></section></main><script>
const STORE='privateDiarySecureV1',ITER=210000;let meta=null,key=null,data={entries:[]},timer=null;const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();function b64(a){return btoa(String.fromCharCode(...new Uint8Array(a)))}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function timestamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}年${p(d.getMonth()+1)}月${p(d.getDate())}日 ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}async function derive(p,s){return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:ITER,hash:'SHA-256'},await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encrypt(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));return{v:1,salt:meta.salt,iv:b64(iv),ct:b64(ct)}}async function persist(){if(!key)return;localStorage.setItem(STORE,JSON.stringify(await encrypt()));$('state').textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}
async function enter(){const p=$('pw').value;if(p.length<6)return alert('密码至少 6 位');try{if(!meta){const salt=crypto.getRandomValues(new Uint8Array(16));meta={salt:b64(salt)};key=await derive(p,salt);await persist()}else{key=await derive(p,unb64(meta.salt));const raw=JSON.parse(localStorage.getItem(STORE));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(raw.iv)},key,unb64(raw.ct));data=JSON.parse(dec.decode(plain));migrateData()}$('pw').value='';$('lock').hidden=true;$('app').hidden=false;render()}catch(e){key=null;alert('密码错误或日记数据无法解密。')}}
function migrateData(){if(Array.isArray(data.entries))return;const entries=[];if(data.days&&typeof data.days==='object')Object.entries(data.days).forEach(([day,list])=>(Array.isArray(list)?list:[]).forEach(s=>entries.push({text:s.text||'',time:`${day} ${s.time||''}`,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())})));data={entries}}
async function lock(){clearTimeout(timer);if($('editor').value.trim())await saveEntry();key=null;$('app').hidden=true;$('lock').hidden=false;$('lockText').textContent='请输入密码进入';$('pw').value=''}
async function saveEntry(){const text=$('editor').value.trim();if(!text||!key)return;data.entries.push({text,time:timestamp(),id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())});$('editor').value='';render();await persist()}
async function removeEntry(index){if(!key)return;const list=getEntries();if(!list[index])return;if(!confirm('确定删除这条日记吗？删除后无法恢复。'))return;data.entries.splice(list[index]._i,1);render();await persist()}
function getEntries(){return data.entries.map((e,i)=>({...e,_i:i})).reverse()}
function render(){const list=getEntries();$('entries').innerHTML=list.length?list.map((s,i)=>`<article class="entry"><div class="text"></div><div class="stamp"></div><button class="delete" onclick="removeEntry(${i})">删除</button></article>`).join(''):'<div class="empty">还没有日记</div>';$('entries').querySelectorAll('.entry').forEach((e,i)=>{e.querySelector('.text').textContent=list[i].text;e.querySelector('.stamp').textContent=list[i].time})}
$('editor').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(persist,1200)});$('editor').addEventListener('blur',()=>{if($('editor').value.trim())saveEntry()});$('editor').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')saveEntry()});meta=localStorage.getItem(STORE)?JSON.parse(localStorage.getItem(STORE)):null;if(meta)$('lockText').textContent='请输入密码进入';if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
